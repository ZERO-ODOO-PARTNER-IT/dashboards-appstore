<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="20" ry="20" fill="url(#bgGrad)"/>
  <!-- Calendar/Activity Icon -->
  <g fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Calendar outline -->
    <rect x="24" y="32" width="80" height="72" rx="8" ry="8" fill="rgba(255,255,255,0.2)"/>
    <!-- Calendar top bar -->
    <line x1="24" y1="52" x2="104" y2="52"/>
    <!-- Calendar hooks -->
    <line x1="44" y1="24" x2="44" y2="40"/>
    <line x1="84" y1="24" x2="84" y2="40"/>
    <!-- Checkmarks for activities -->
    <polyline points="36,68 42,74 54,62" stroke="#4ade80" stroke-width="5"/>
    <polyline points="36,88 42,94 54,82" stroke="#4ade80" stroke-width="5"/>
    <!-- Activity lines -->
    <line x1="64" y1="68" x2="96" y2="68" stroke-width="3"/>
    <line x1="64" y1="88" x2="88" y2="88" stroke-width="3"/>
  </g>
</svg>
